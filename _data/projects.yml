- id: enso
  title: Impact of ENSO on Rainfall Variability Across Major Kharif Crop Growing States
  home_title: Impact of ENSO on Kharif Crop Rainfall Variability
  label: ENSO &amp; Rainfall
  featured: true
  area: [Monsoon Dynamics, "IDEAS-TIH, ISI Kolkata"]
  period: May 2026 – Jul 2026
  summary: >-
    Summer project with IDEAS-TIH, ISI Kolkata: an interpolation pipeline that
    raises the resolution of IMD gridded rainfall data, and ENSO sensitivity
    indices across major kharif crop-growing states.
  description: >-
    Research project and training program with IDEAS-TIH, ISI Kolkata. I
    built an interpolation method to obtain higher-resolution rainfall data
    than the IMD portal provides, automated the per-state workflow, and
    classified rainfall variability using ENSO sensitivity indices.
  equation: '\text{ESI} = \frac{\bar{P}_{\text{El Niño}} - \bar{P}_{\text{La Niña}}}{\sigma_{\text{climatology}}}'
  bullets:
    - Carried out exploratory data analysis of IMD gridded daily rainfall data.
    - Developed an interpolation method to obtain rainfall at a higher resolution than the IMD portal provides.
    - Automated the Google Sheets workflow with Python and the Google Cloud APIs so the analysis runs per state.
    - Developed a metric for rainfall variability and classified states using the ENSO Sensitivity Index and related measures.
  tools: [IMD gridded data, Interpolation, Python, Google Cloud]
  links:
    - { label: GitHub repository, url: "https://github.com/avtarfr/ENSO-Impact-Prediction-2026", primary: true }

