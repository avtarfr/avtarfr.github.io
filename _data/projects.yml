# Single source for the homepage project list and projects.html (newest first).
#
#   featured     shown on the homepage
#   home_title   shorter title for the homepage (falls back to title)
#   summary      homepage blurb; description + bullets are used on projects.html
#   equation     LaTeX, rendered with KaTeX and offered as "Copy LaTeX"
#   links        `primary: true` styles the button as the main action
#
# Text fields are HTML: write & as &amp;. Inline math uses $...$.

- id: lorenz96
  title: Parameterization of Lorenz-96 and Testing Online Stability Against Training Data Volume
  home_title: Lorenz-96 Subgrid Parameterization &amp; Online Stability
  label: Lorenz-96
  featured: true
  area: [Dynamical Systems, Independent Study]
  period: Aug 2026 – Present
  summary: >-
    How much training data does a neural network need to parameterize the
    unresolved subgrid coupling $U_k$ without drift or blow-up when it is
    integrated online in the reduced Lorenz-96 model?
  description: >-
    How much training data does a neural network need to parameterize the
    unresolved subgrid coupling $U_k$ without drift or instability when it is
    integrated online in the reduced (slow-variable only) Lorenz-96 model, as
    opposed to merely being accurate offline?
  equation: '\frac{dX_k}{dt} = -X_{k-1}(X_{k-2} - X_{k+1}) - X_k + F - \hat{U}_k(X)'
  bullets:
    - >-
      Replicated the <a href="https://m2lines.github.io/L96_demo/intro.html" target="_blank" rel="noopener noreferrer">M²LInES
      Lorenz-96 notebooks</a>: the two-tier baseline, offline training, and
      online coupling.
    - >-
      Running a data-volume sweep across 10 training-data volumes for two
      models with different activation functions, 20 models in all.
    - Comparing offline fit ($R^2$, MSE) against long-horizon online stability for each model.
  tools: [Lorenz-96, Subgrid closures, RK4, PyTorch]
  links:
    - { label: Read the writeup, url: /writeups/lorenz96.html, primary: true }
    - { label: GitHub repository, url: "https://github.com/avtarfr/l96_param" }

